<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">GPT-style icon for 100 Days of Code</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="50%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#60e6a7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="200" fill="url(#g)"/>
  </g>

  <!-- Abstract neural / swirl shape -->
  <g transform="translate(256,256) scale(0.9)">
    <path d="M-110,-20 C-80,-80 0,-110 60,-90 C120,-70 140,-10 110,30 C80,70 10,110 -50,95 C-110,80 -140,20 -110,-20 Z"
          fill="#ffffff" opacity="0.16"/>
    <path d="M-90,-10 C-58,-60 8,-82 58,-68 C106,-54 128,-12 103,18 C78,48 18,82 -30,70 C-78,58 -122,12 -90,-10 Z"
          fill="#ffffff" opacity="0.32"/>
  </g>

  <!-- GPT letters stylized -->
  <g transform="translate(256,264)" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif">
    <text x="0" y="0" font-size="86" font-weight="700" fill="#051622">GPT</text>
  </g>

</svg>
